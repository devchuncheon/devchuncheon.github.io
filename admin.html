function backBtn() {

  if (NAV.t) { var tt = NAV.t, gg = NAV.g; go = function () { tileMenu(tt, gg); }; label = tt.t; }

/* 서버 부르기 */
function run(fn, args, ok, errBox) {
  busy(true);
  var r = google.script.run.withSuccessHandler(function (res) {
    busy(false);
    if (res && res.error) {
      if (res.error === 'LOGIN') { store(KEY, ''); login('다시 로그인해 주십시오.'); return; }
      if (errBox) errBox.textContent = res.error; else alert(res.error);
      return;
    }
    ok(res);
  }).withFailureHandler(function (e) {
    busy(false);
    var m = '연결이 잠시 끊겼습니다. 다시 눌러 주십시오.';
    if (errBox) errBox.textContent = m; else alert(m);
  });
  r[fn].apply(r, args);
}
function api(action, args, ok, errBox) { run('adminApi', [LINK, store(KEY), action, args || {}], ok, errBox); }

/* 로그인 */
function login(msg) {
  ME = null; clear(); header();
  var id = input('text', '아이디'), pw = input('password', '비밀번호'), err = el('p', 'err', msg || '');
  var go = function () {
    err.textContent = '';

}

var CHUN = [37.8813, 127.7298];

function ask(o, cb) {

  (o.btns || [['확인', 'ok'], ['취소', null]]).forEach(function (b) {

  });

/* 빠진 것 표시: ✓ 붙어 있음 / ✗ 아직 없음 / — 일부러 뺌 */
var CKMARK = { ok: '✓', no: '✗', skip: '—' };
/* 사진·쇼츠·안내문은 1·2·3을 한 칸으로 묶어 보임: "사진 1✓ 2✗ 3—" (2026-11-18) */
function ckGroups(chk) {
  var out = [], at = {};
  (chk || []).forEach(function (c) {
    if (!c.g) { out.push({ s: c.s, t: c.k + ' ' + CKMARK[c.s] }); return; }
    var n = c.k.slice(c.g.length + 1);
    if (!at[c.g]) { at[c.g] = { g: c.g, list: [] }; out.push(at[c.g]); }
    at[c.g].list.push({ n: n, s: c.s });
  });
  return out.map(function (x) {
    if (!x.g) return x;
    var ss = x.list.map(function (y) { return y.s; });
    return { s: ss.indexOf('no') >= 0 ? 'no' : ss.indexOf('ok') >= 0 ? 'ok' : 'skip', t: x.g + ' ' + x.list.map(function (y) { return y.n + CKMARK[y.s]; }).join(' ') };
  });
}
function ckEl(chk) { var d = el('div', 'ckl'); (chk || []).forEach(function (c) { var s = el('span', 'ck ' + c.s, c.g ? c.k.replace(' ', '') : c.k + ' ' + CKMARK[c.s]); s.title = c.s === 'ok' ? '붙어 있음' : c.s === 'skip' ? '안 씀' : '아직 없음'; if (c.s === 'skip') s.style.textDecoration = 'line-through'; d.appendChild(s); }); return d; } // (사진1)(사진2)(사진3)… 칸마다 따로 (2026-11-21 대표 요청)
function ckMiss(chk) { return (chk || []).filter(function (c) { return c.s === 'no'; }).length; }

    app.appendChild(card(el('h2', '', '2. 지도에서 포인트 찍기'),

      md, el('p', 'small', '초록 = 이 코스(작성 중) · 보라 네모 = 다른 코스도 지나는 갈림길 · 회색 = 다른 코스의 포인트'), lineLegend(r.lines, r.no, true)));

    else {

          addPt({ lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)), name: name });
        });
      };
      var backTo = function (p) {

/* 자료 올리기 상자: 내 자료(이 포인트) / 공통. 사진·쇼츠 = 파일 또는 주소(유튜브·드라이브), 안내문 = 글 */

/* 콘텐츠 칸 표시: (쇼츠1)(쇼츠2)(쇼츠3) (사진1)… 칸마다 색 — 초록 붙음, 빨강 없음, 회색 안 씀 (2026-11-21 대표 요청) */

function cMissN(chk) { return (chk || []).filter(function (c) { return c.g && c.s === 'no'; }).length; }
/* 코스 지도 상자 */
function cCourseMap(r) {

/* ---------- 미리보기 (방문자 화면처럼 휴대폰 폭으로) ---------- */
