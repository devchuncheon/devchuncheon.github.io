<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>걸어서 춘천 관리</title>
<meta name="theme-color" content="#1f4e3d">
<!-- 관리자 화면은 manifest를 쓰지 않음: 홈 화면 아이콘이 개인 주소(?adm=) 그대로 열리게 (2026-11-18) -->
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="걸어서 춘천">
<script src="config.js"></script>
<script src="gas-shim.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f2f4f1; color: #1f2933; font-size: 17px; }
#app { max-width: 560px; margin: 0 auto; padding: 12px 12px 40px; }
.top { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 12px; }
.top .t { font-weight: 800; color: #1f4e3d; font-size: 19px; }
.top .w { font-size: 13px; color: #52606d; text-align: right; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin: 0 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
h1 { font-size: 21px; margin: 0 0 10px; color: #1f4e3d; }
h2 { font-size: 17px; margin: 0 0 8px; }
p { margin: 6px 0; line-height: 1.5; }
.small { font-size: 14px; color: #52606d; }
.warn { background: #fff4d6; border: 1px solid #f0c75e; color: #7a5300; border-radius: 12px; padding: 12px; margin: 0 0 12px; font-size: 15px; }
.alertbox { background: #fde8e8; border: 1px solid #e19a9a; color: #8a1c1c; border-radius: 12px; padding: 12px; margin: 0 0 12px; font-size: 15px; white-space: pre-line; }
.err { color: #b42318; font-size: 15px; margin: 8px 0 0; white-space: pre-line; }
.ok { color: #1f7a4d; font-size: 15px; margin: 8px 0 0; white-space: pre-line; }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.num { background: #eef5f0; border-radius: 12px; padding: 10px 4px; text-align: center; }
.num b { display: block; font-size: 26px; color: #1f4e3d; }
.num span { font-size: 13px; color: #52606d; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: #fff; border: 0; border-radius: 14px; padding: 18px 8px; font-size: 17px; font-weight: 700; color: #1f4e3d; box-shadow: 0 1px 3px rgba(0,0,0,.1); cursor: pointer; }
.tile .ic { display: block; font-size: 28px; margin-bottom: 6px; }
.tile.off { color: #9aa5b1; cursor: default; }
button.b { display: block; width: 100%; height: 52px; border: 0; border-radius: 12px; background: #1f4e3d; color: #fff; font-size: 17px; font-weight: 700; margin: 8px 0 0; cursor: pointer; }
button.b.sub { background: #e4ece7; color: #1f4e3d; }
button.b.red { background: #b42318; }
button.b:disabled { opacity: .5; }
input[type=text], input[type=password], textarea { width: 100%; font-size: 17px; padding: 12px; border: 1px solid #cbd2d9; border-radius: 10px; margin: 4px 0 8px; font-family: inherit; }
textarea { min-height: 110px; }
label { font-size: 15px; color: #3e4c59; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid #eef0f2; }
.row:first-of-type { border-top: 0; }
.row .l { flex: 1; min-width: 0; }
.row .l b { display: block; }
.row .l span { font-size: 13px; color: #52606d; word-break: break-all; }
.sw { flex: none; min-width: 84px; height: 40px; border: 0; border-radius: 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
.sw.on { background: #1f7a4d; color: #fff; }
.sw.off { background: #e4e7eb; color: #52606d; }
.sw.danger { background: #b42318; color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 8px; }
.chip { border: 1px solid #1f4e3d; background: #fff; color: #1f4e3d; border-radius: 18px; padding: 8px 14px; font-size: 15px; cursor: pointer; }
.chip.sel { background: #1f4e3d; color: #fff; }
.copy { font-size: 13px; background: #f5f7fa; border-radius: 8px; padding: 8px; word-break: break-all; margin: 6px 0; user-select: all; }
.busy { position: fixed; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, #1f4e3d 30%, #a7d3b9 30%); animation: mv 1s linear infinite; background-size: 200% 100%; display: none; }
@keyframes mv { from { background-position: 0 0; } to { background-position: -200% 0; } }
#map { height: 400px; border-radius: 12px; margin: 8px 0; background: #e8ece9; }
.pin { background: #1f7a4d; color: #fff; border-radius: 50%; width: 30px; height: 30px; line-height: 26px; text-align: center; font-size: 11px; font-weight: 700; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.pin.x { background: #534ab7; border-radius: 7px; }
.pin.off { background: #9aa5b1; }
.pin.sq { border-radius: 7px; }
.legend i.sq { border-radius: 3px; background: #fff !important; border: 2px solid #52606d; width: 10px; height: 10px; }
.pin.miss::after { content: ''; position: absolute; right: -3px; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: #e02424; border: 2px solid #fff; }
.pin { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: #52606d; margin: 4px 0 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.askbg { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px; }
.pl { white-space: pre-line; }
.circles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; justify-items: center; }
.circ { width: 78px; height: 78px; border-radius: 50%; background: #eef5f0; border: 2px solid #1f4e3d; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.circ b { font-size: 24px; color: #1f4e3d; line-height: 1.1; }
.circ span { font-size: 11px; color: #52606d; white-space: nowrap; letter-spacing: -0.5px; }
.grp { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #eef0f2; }
.grp:first-child { border-top: 0; }
.gl { flex: none; width: 62px; font-size: 19px; font-weight: 800; color: #1f4e3d; }
.gi { flex: 1; border-left: 3px solid #1f4e3d; padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
.gbtn { position: relative; text-align: left; border: 0; border-radius: 10px; background: #e4ece7; color: #1f4e3d; font-size: 17px; font-weight: 700; padding: 12px 14px; cursor: pointer; }
.gbtn::before { content: ''; position: absolute; left: -15px; top: 50%; width: 12px; border-top: 3px solid #1f4e3d; }
.gbtn.off { color: #9aa5b1; background: #f2f4f1; cursor: default; }
.gcard { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; border-radius: 18px; padding: 16px; margin: 0 0 12px; background: #fff; box-shadow: 0 2px 8px rgba(31,78,61,.10); cursor: pointer; text-align: left; font-family: inherit; transition: transform .08s; }
.gcard:active { transform: scale(.98); }
.gcard .gic, .ghead .gic { flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.gcard .gt { flex: 1; min-width: 0; }
.gcard .gt b { display: block; font-size: 21px; color: #1f2933; }
.gcard .gt span { display: block; font-size: 13px; color: #52606d; margin-top: 2px; }
.gbadge { display: flex; gap: 6px; margin-top: 6px; }
.gbadge em { font-style: normal; font-size: 13px; font-weight: 700; color: #1f7a4d; background: #dff0e6; border-radius: 10px; padding: 2px 9px; }
.gbadge em.w { color: #8a5a00; background: #fcecd5; }
.gcard .chev { font-size: 30px; color: #9aa5b1; line-height: 1; }
.gcard.off, .stile.off { opacity: .4; cursor: default; }
.c-course .gic, .c-course .sic { background: #dff0e6; }
.c-stat .gic, .c-stat .sic { background: #e2ebfb; }
.c-ops .gic, .c-ops .sic { background: #fcecd5; }
.c-course.gcard { border-left: 6px solid #1f7a4d; }
.c-stat.gcard { border-left: 6px solid #3b6fd1; }
.c-ops.gcard { border-left: 6px solid #d98a1c; }
.ghead { display: flex; align-items: center; gap: 12px; margin: 0 2px 12px; }
.ghead b { font-size: 22px; color: #1f2933; }
.subgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stile { border: 0; border-radius: 18px; background: #fff; box-shadow: 0 2px 8px rgba(31,78,61,.10); padding: 18px 10px 16px; text-align: center; cursor: pointer; font-family: inherit; transition: transform .08s; }
.stile:active { transform: scale(.97); }
.stile .sic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.stile b { display: block; font-size: 17px; color: #1f2933; }
.stile span { display: block; font-size: 12px; color: #52606d; margin-top: 4px; line-height: 1.35; }
.circ { box-shadow: 0 2px 6px rgba(31,78,61,.12); background: #fff; }
.botrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 380px) { .circ { width: 66px; height: 66px; } .circ b { font-size: 20px; } }
.ckl { margin-top: 4px; line-height: 1.9; }
.ck { display: inline-block; font-size: 13px; border-radius: 6px; padding: 0 6px; margin: 0 4px 0 0; white-space: nowrap; }
.ck.ok { background: #e3f1e8; color: #1f7a4d; }
.ck.no { background: #fde8e8; color: #b42318; font-weight: 700; }
.ck.skip { background: #eef0f2; color: #7b8794; }
.askbox { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 420px; white-space: pre-line; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="busy" id="busy"></div>
<div id="app"><p class="small" style="text-align:center;margin-top:60px">불러오는 중입니다.</p></div>
<script>
var LINK = (new URLSearchParams(location.search).get('adm') || '').replace(/[^a-z0-9]/g, '').slice(0, 20);
var app = document.getElementById('app');
var KEY = 'adm_' + LINK;
var ME = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === '') localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; for (var i = 3; i < arguments.length; i++) if (arguments[i]) e.appendChild(arguments[i]); return e; }
function card() { var c = el('div', 'card'); for (var i = 0; i < arguments.length; i++) if (arguments[i]) c.appendChild(arguments[i]); return c; }
function btn(text, fn, cls) { var b = el('button', 'b ' + (cls || ''), text); b.onclick = fn; return b; }
function input(type, ph, val) { var i = el('input'); i.type = type; i.placeholder = ph || ''; if (val) i.value = val; i.autocomplete = 'off'; return i; }
function clear() { app.innerHTML = ''; window.scrollTo(0, 0); }
function busy(on) { document.getElementById('busy').style.display = on ? 'block' : 'none'; var bs = document.querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].disabled = !!on; }
function header(title) {
  var t = el('div', 'top', null, el('div', 't', title || '관리자 화면'));
  if (ME) t.appendChild(el('div', 'w', ME.name + ' (' + (ME.role === '대표' ? '대표' : '직원') + ')'));
  app.appendChild(t);
}
/* 되돌아가기 = 바로 앞 단계 (2026-11-18 대표 요청). NAV.g = 들어온 묶음(코스·운영), NAV.t = 들어온 메뉴(TILES) */
var NAV = {};
function backBtn() {
  var f = document.createDocumentFragment(), go = null, label = '';
  if (NAV.t) { var tt = NAV.t, gg = NAV.g; go = function () { tileMenu(tt, gg); }; label = tt.t; }
  else if (NAV.g) { var g2 = NAV.g; go = function () { openGroup(g2); }; label = g2.t; }
  if (go) f.appendChild(btn('← ' + label + ' 화면으로', function () { dropMap(); go(); }));
  f.appendChild(btn('관리 첫 화면으로', function () { dropMap(); home(); }, 'sub'));
  return f;
}

/* 서버 부르기 */
function run(fn, args, ok, errBox) {
  busy(true);
  var r = google.script.run.withSuccessHandler(function (res) {
    busy(false);
    if (res && res.error) {
      if (res.error === 'LOGIN') { store(KEY, ''); login('다시 로그인해 주십시오.'); return; }
      if (errBox) errBox.textContent = res.error; else alert(res.error);
      return;
    }
    ok(res);
  }).withFailureHandler(function (e) {
    busy(false);
    var m = '연결이 잠시 끊겼습니다. 다시 눌러 주십시오.';
    if (errBox) errBox.textContent = m; else alert(m);
  });
  r[fn].apply(r, args);
}
function api(action, args, ok, errBox) { run('adminApi', [LINK, store(KEY), action, args || {}], ok, errBox); }

/* 처음 대표 만들기 (?a=setup) */
function setup() {
  clear(); header('대표 만들기');
  var code = input('text', '설정 코드'), id = input('text', '아이디 (영문·숫자)'), nm = input('text', '이름'), pw = input('password', '비밀번호 (8자 이상)'), pw2 = input('password', '비밀번호 한 번 더');
  var err = el('p', 'err');
  app.appendChild(card(el('p', 'small', '스프레드시트 설정 시트의 "관리자설정코드"를 넣고, 대표의 아이디와 비밀번호를 정해 주십시오. 한 번만 할 수 있습니다.'),
    el('label', '', '설정 코드'), code, el('label', '', '아이디'), id, el('label', '', '이름'), nm, el('label', '', '비밀번호'), pw, pw2,
    btn('대표 만들기', function () {
      err.textContent = '';
      if (pw.value !== pw2.value) { err.textContent = '두 비밀번호가 다릅니다.'; return; }
      run('adminSetup', [code.value, id.value, nm.value, pw.value], function (r) {
        clear(); header('대표 만들기');
        app.appendChild(card(el('h1', '', '만들었습니다'), el('p', '', '아래가 대표 전용 주소입니다. 휴대폰 홈 화면에 추가하거나 따로 적어 두십시오. 이 주소로 들어가 아이디와 비밀번호로 로그인합니다.'),
          el('div', 'copy', r.link), btn('이 주소로 가기', function () { window.open(r.link, '_top'); })));
      }, err);
    }), err));
}

/* 로그인 */
function login(msg) {
  ME = null; clear(); header();
  var id = input('text', '아이디'), pw = input('password', '비밀번호'), err = el('p', 'err', msg || '');
  var go = function () {
    err.textContent = '';
    run('adminLogin', [LINK, id.value, pw.value], function (r) {
      store(KEY, r.token);
      if (r.change) changePw(true); else home();
    }, err);
  };
  pw.onkeydown = function (e) { if (e.key === 'Enter') go(); };
  app.appendChild(card(el('h1', '', '관리자 로그인'), el('label', '', '아이디'), id, el('label', '', '비밀번호'), pw, btn('로그인', go), err,
    el('p', 'small', '이 주소는 본인 전용입니다. 다른 사람에게 알려 주지 마십시오. 5번 틀리면 10분 동안 잠깁니다.')));
}

function changePw(first) {
  clear(); header();
  var pw = input('password', '새 비밀번호 (8자 이상)'), pw2 = input('password', '새 비밀번호 한 번 더'), err = el('p', 'err');
  app.appendChild(card(el('h1', '', first ? '처음 로그인: 비밀번호 바꾸기' : '비밀번호 바꾸기'),
    first ? el('p', 'small', '대표에게 받은 임시 비밀번호를 본인만 아는 비밀번호로 바꿔 주십시오.') : null,
    pw, pw2, btn('바꾸기', function () {
      if (pw.value !== pw2.value) { err.textContent = '두 비밀번호가 다릅니다.'; return; }
      api('changePw', { pw: pw.value }, function () { alert('비밀번호를 바꿨습니다.'); home(); }, err);
    }), err, first ? null : backBtn()));
}

/* 관리 첫 화면: 큰 단추 6개 (2026-11-16, 기획 원본 슬라이드 순서) */
var TILES = [
  { k: '코스', ic: '🗺️', t: '코스 설계', top: function (c) { courseStats(c); }, items: [['코스 만들기·고치기 (지도)', function () { designList(); }], ['코스 공개·숨김', function () { courses(); }, '코스 테스트 (가능·준비 중)'], ['코스 내보내기']] }, // 코스 미리보기는 지운 메뉴 (2026-11-18, 코스 만들기로 확인)
  { k: '포인트', ic: '📍', t: '포인트', items: [['포인트 관리 (코스 지도)', function () { pointCourses(); }], ['모든 포인트 목록 (켜기·끄기)', function () { points(); }], ['포인트 미리보기'], ['선물처·홍보처·휴식처']] },
  { k: '콘텐츠', ic: '🎬', t: '콘텐츠', items: [['콘텐츠 붙이기'], ['콘텐츠 창고'], ['유튜브 주소 가져오기']] },
  { k: '답사', ic: '🚶', t: '답사', items: [['답사 시작 (휴대폰)'], ['임시 추가 확정']] },
  { k: '운영', ic: '🛠️', t: '운영', items: [['긴급공지·길 통제', function () { notice(); }], ['선물처 운영·오늘 마감', function () { stores(); }], ['운영 조건·상황 단추']] },
  { k: '통계', ic: '📊', t: '통계', items: [['기본 통계'], ['특별 요청'], ['질문 관리']] }
];

/* 첫 화면 묶음 (2026-11-18 대표 그림 → 단추로 아래 단계에 들어감) */
var GROUPS = [
  { t: '코스', ic: '🗺️', cls: 'c-course', items: [
    { k: '코스', t: '코스 설계', ic: '🗺️', d: '지도에서 코스 만들기' },
    { k: '포인트', t: '포인트', ic: '📍', d: '코스 지도로 포인트 상황·관리' },
    { k: '답사', t: '답사', ic: '🚶', d: '현장에서 위치·사진 모으기' },
    { k: '콘텐츠', t: '콘텐츠', ic: '🎬', d: '쇼츠·사진 붙이기' }] },
  { t: '통계', ic: '📊', cls: 'c-stat', items: [
    { k: '통계', t: '통계', ic: '📊', d: '기본 통계·특별 요청·질문 관리' }] },
  { t: '운영', ic: '🛠️', cls: 'c-ops', items: [
    { k: '운영', t: '운영', ic: '🛠️', d: '긴급공지·길 통제·선물처' },
    { k: '관리자', t: '직원 관리', ic: '👥', d: '직원 등록·맡긴 일', fn: function () { admins(); } }] }

      r.points.forEach(function (p) {
        if (p.lat === null) return;
        var m = ckMiss(p.chk), cls = 'pin' + (p.courses.length > 1 ? ' sq' : '') + (p.on ? '' : ' off') + (m ? ' miss' : '');
        var ic = L.divIcon({ className: '', html: '<div class="' + cls + '">' + p.no + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
        var mk = L.marker([p.lat, p.lng], { icon: ic }).addTo(MAP);
        mk.bindTooltip(pos[p.no].join('·') + '번째 · ' + p.no + ' ' + (noEx(p.name) || '(이름 없음)') + (p.on ? ' · 켜짐' : ' · 꺼짐'));
        mk.on('click', function () {
          var txt = p.no + ' ' + (noEx(p.name) || '(이름 없음)') + '\n' + pos[p.no].join('·') + '번째 · ' + (p.stage || '임시') + ' · ' + (p.on ? '켜짐' : '꺼짐') + ' · 오늘 ' + p.today + '번'
            + (p.courses.length > 1 ? '\n갈림길: ' + p.courses.join('·') + '코스' : '')
            + '\n' + p.chk.map(function (c) { return c.k + ' ' + CKMARK[c.s]; }).join('  ');
          ask({ text: txt, btns: [[p.on ? '끄기' : '켜기', 'tog', p.on ? 'red' : ''], ['정보 고치기', 'info'], ['QR 주소 보기', 'qr', 'sub'], ['닫기', null]] }, function (v) {
            if (v === 'tog') api('setPoint', { no: p.no, on: !p.on }, again);
            else if (v === 'info') { dropMap(); pointForm(r.no, p.no); }
            else if (v === 'qr') ask({ text: p.no + ' QR 주소\n' + (p.url || '(키가 없습니다)'), btns: [['닫기', null]] });
          });
        });
      });
      if (view) MAP.setView(view.c, view.z);
      else if (line.length > 1) MAP.fitBounds(line, { padding: [40, 40] });
      else if (line.length === 1) MAP.setView(line[0], 16);
      else MAP.setView(CHUN, 14);
    }
    var lc = card(el('h2', '', '포인트 (걷는 순서)'));
    if (!r.points.length) lc.appendChild(el('p', 'small', '이 코스에 포인트가 없습니다. 코스 설계의 "코스 만들기"에서 지도에 찍어 주십시오.'));
    r.points.forEach(function (p) { lc.appendChild(pointLine(p, r.no, again, pos[p.no].join('·') + '. ')); });
    if (r.points.length) {
      var bb = el('div', 'botrow');
      bb.appendChild(btn('모두 켜기', function () { api('pSetMany', { course: r.no, on: true }, again); }));
      bb.appendChild(btn('모두 끄기', function () {
        ask({ text: r.no + '코스의 포인트를 모두 끌까요?\n다른 코스와 함께 쓰는 포인트(갈림길)도 꺼져서 그 코스에서도 안 보이게 됩니다.', btns: [['모두 끄기', 'ok', 'red'], ['취소', null]] }, function () { api('pSetMany', { course: r.no, on: false }, again); });
      }, 'sub'));
      lc.appendChild(bb);
    }
    app.appendChild(lc);
    app.appendChild(btn('다른 코스 고르기', pointCourses, 'sub'));
    app.appendChild(backBtn());
    setTimeout(function () { if (MAP) MAP.invalidateSize(); }, 300);
  });
}

/* 직원 관리 (대표) */
function permChips(all, sel) {
  var box = el('div', 'chips'), picked = sel.slice();
  all.forEach(function (p) {
    var ch = el('button', 'chip' + (picked.indexOf(p) >= 0 ? ' sel' : ''), p);
    ch.onclick = function () { var i = picked.indexOf(p); if (i >= 0) picked.splice(i, 1); else picked.push(p); ch.className = 'chip' + (picked.indexOf(p) >= 0 ? ' sel' : ''); };
    box.appendChild(ch);
  });
  box.value = function () { return picked; };
  return box;
}

function shown(title, lines) {
  var c = card(el('h1', '', title));
  lines.forEach(function (l) { if (l[0]) c.appendChild(el('label', '', l[0])); c.appendChild(el('div', 'copy', l[1])); });
  c.appendChild(el('p', 'small', '임시 비밀번호는 지금 한 번만 보입니다. 주소와 함께 그분께 직접 전해 주십시오. 처음 로그인하면 본인 비밀번호로 바꾸게 됩니다.'));
  c.appendChild(btn('확인', admins));
  clear(); header('직원 관리'); app.appendChild(c);
}

function admins() {
  api('admins', {}, function (r) {
    clear(); header('직원 관리');
    var id = input('text', '아이디 (영문·숫자)'), nm = input('text', '이름'), pc = permChips(r.perms, []), err = el('p', 'err');
    app.appendChild(card(el('h1', '', '직원 등록'), el('label', '', '아이디'), id, el('label', '', '이름'), nm, el('label', '', '맡길 일'), pc,
      btn('등록하고 개인 접속 주소 만들기', function () {
        api('addAdmin', { id: id.value, name: nm.value, perms: pc.value() }, function (x) {
          shown('등록했습니다', [['개인 주소', x.link], ['아이디', x.id], ['임시 비밀번호', x.temp]]);
        }, err);
      }), err));
    var c = card(el('h1', '', '직원 목록'));
    r.list.forEach(function (m) {
      var box = el('div', 'card');
      box.style.boxShadow = 'none'; box.style.border = '1px solid #e4e7eb';
      box.appendChild(el('h2', '', m.name + ' (' + m.id + ')' + (m.role === '대표' ? ' · 대표' : '')));
      box.appendChild(el('p', 'small', '상태: ' + m.state + (m.change ? ' · 비밀번호 아직 안 바꿈' : '') + ' · 마지막 접속: ' + (m.last || '없음')));
      if (m.role !== '대표') {
        var pc2 = permChips(r.perms, m.perms);
        box.appendChild(el('label', '', '맡긴 일'));
        box.appendChild(pc2);
        box.appendChild(btn('맡긴 일 저장', function () { api('editAdmin', { id: m.id, what: 'perms', perms: pc2.value() }, function () { alert('저장했습니다.'); admins(); }); }, 'sub'));
        box.appendChild(m.state === '사용'
          ? btn('사용 중지 (바로 막기)', function () { if (confirm(m.name + '님을 사용 중지할까요? 로그인한 휴대폰도 바로 막힙니다.')) api('editAdmin', { id: m.id, what: 'stop' }, function () { admins(); }); }, 'red')
          : btn('다시 사용', function () { api('editAdmin', { id: m.id, what: 'start' }, function () { admins(); }); }));
        box.appendChild(btn('주소 새로 만들기 (예전 주소 막기)', function () { if (confirm('예전 주소는 더 이상 열리지 않습니다. 새로 만들까요?')) api('editAdmin', { id: m.id, what: 'link' }, function (x) { shown('새 주소', [['개인 주소', x.link]]); }); }, 'sub'));
      }
      box.appendChild(btn('임시 비밀번호 새로 주기', function () { if (confirm('비밀번호를 새로 정할까요? 로그인한 휴대폰은 다시 로그인해야 합니다.')) api('editAdmin', { id: m.id, what: 'reset' }, function (x) { if (m.id === ME.id) { store(KEY, ''); } shown('임시 비밀번호', [['아이디', m.id], ['임시 비밀번호', x.temp]]); }); }, 'sub'));
      var u = el('div', 'copy', m.link); u.style.display = 'none';
      var t = el('button', 'chip', '주소 보기'); t.onclick = function () { u.style.display = u.style.display === 'none' ? 'block' : 'none'; };
      box.appendChild(t); box.appendChild(u);
      c.appendChild(box);
    });
    app.appendChild(c);
    app.appendChild(backBtn());
  });
}

if (LINK === 'setup') setup();
else if (store(KEY)) home();
else login('');
</script>
</body>
</html>
